; This is the setup file for VMP-500 (Wuest EAWAG, Switzerland).
; 2014-08-06, RGL at Rockland Scientific
;
; Use This setup file for NORMAL ASTP Board
;
; Any line that begins with ";", semi-column symbol, is a comment and is ignored 
; by all programs that read this file. Use it to make notes and comments.
;
; sensors shear and temperature have nominal values input in this setup file.
; Update these values and sensor SN-numbers prior to deployment.
; Edited 2018-05-15 adding FLNTU sensor and GPAIO PCB to instrument.
; 2018-07-18, RGL, small correction to channel 81. Added [instrumetn_info] section.
; 2022-09-13: Update channel 16,17 and 18,19 mpl
; 2024-12-04: Updates (Tomy Doda)
; 2025-11-20: Copy of config file (Tomy Doda)
; 2026-02-13: Update SN, shear sensitivities and pressure offset (Tomy Doda)
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
; This is a partial list of standard channels (addresses) and their signals
; 0	Reference ground
; 1	Ax or tilt - horizontal acceleration in the direction of the pressure port
; 2	Ay or roll - horizontal acceleration orthogonal to the direction of the pressure port
; 3	Az vertical acceleration
; 4	T1 - Temperature from Thermistor 1 without pre-emphasis
; 5	T1_dT1 - Temperature from Thermistor 1 with pre-emphasis
; 6	T2 - Temperature from Thermistor 2 without pre-emphasis
; 7	T2_dT2 - Temperature from Thermistor 2 with pre-emphasis
; 8	Sh1 - velocity derivative from shear probe 1
; 9 Sh2 - velocity derivative from shear probe 2
;10	P - pressure signal without pre-emphasis
;11	P_dP - pressure signal with pre-emphasis
;12	C1_dC1 - micro-conductivity with pre-emphasis
;13	C2_dC2 - micro-conductivity with pre-emphasis
;16,17	SBT1 - The addresses of the SBE3 thermometer that returns the least and
;       most significant halves of the 32-bit data word
;18,19	SBC1 - The addresses of the SBE4 conductivity sensor that returns the 
;       least and most significant halves of the 32-bit data word
; 80     Gnd_2,  - slow - pseudo ground
; 81     NTU     - slow - Wetlabs NTU
; 82     FL      - slow - Wetlabs FL
;255	Special Character that always returns 32752D or 7FF0H and is used to test the
;		integrity of communication.
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
;
; start of root section
rate=512
prefix=VMP
disk=
recsize=1
profile=vertical
man_com_rate=4

no-fast=9
no-slow=2
;
; end of root section
;
; start of address matrix section
[matrix]
num_rows=8
row01=	255	0	1	2	3	5	7	8	9	12	13
row02=	4	6	1	2	3	5	7	8	9	12	13
row03=	10	11	1	2	3	5	7	8	9	12	13
row04=	16	17	1	2	3	5	7	8	9	12	13
row05=	18	19	1	2	3	5	7	8	9	12	13
row06=	80	0	1	2	3	5	7	8	9	12	13
row07=	81	82	1	2	3	5	7	8	9	12	13
row08=	0	0	1	2	3	5	7	8	9	12	13
;end of address matrix section

;start if instrument information section. Must have vehicle.
[instrument_nfo]
vehicle = vmp;
model = VMP-500
SN = 28

; end of instrument information

;start of the optional cruise identification section
[cruise_id]
lake=
operator=
funding_agent=
my_favourite_pet=
my_girlfriend=
number_of_moose_shot=
;
; end of cruise identification section
;
; start of channel identification and calibration information

[channel]
id=0
name=Gnd
type=gnd

[channel]
id=1
name=Ax
type=accel
coef0=1571.5
coef1=5865.5
display=true

[channel]
id=2
name=Ay
type=accel
coef0=1606.5
coef1=5312.5
display=true

[channel]
id=3
name=Az
type=accel
coef0=-40
coef1=5154.0
display=false

[channel]
id=4
name=T1
type=therm
a=-38.0
b=0.99829
G=11
E_B=0.6822
adc_fs=5.000
adc_bits=16
units=[degC]
display=true
; Probe calibration values
beta_1=2591.984856
beta_2=-11055.924592
T_0=283.624415
SN=T1704

[channel]
id=5
name=T1_dT1
type=therm
diff_gain=1.00
display=false

[channel]
id=6
name=T2
type=therm
a=-46
b=0.99838
G=11
E_B=0.6822
adc_fs=5.000
adc_bits=16
units=[degC]
display=true
; Probe calibration values
beta_1=2304.785064
beta_2=-7206.631242
T_0=288.281209
SN=T1699

[channel]
id=7
name=T2_dT2
type=therm
diff_gain=1.00
display=false

[channel]
id=8
name=sh1
type=shear
adc_fs=5.000
adc_bits=16
diff_gain=1.00
display=false
; Sensitivity for Probe (from 2019 cfg file)
sens=0.0876
SN=M2079

; No sh2 probe
[channel]
id=9
name=sh2
type=shear
adc_fs=5.000
adc_bits=16
diff_gain=1.05
display=false
; No sh2 probe
sens=0.1 
;SN=0

[channel]
id=10
name=P
type=poly
; Subtract measured air pressure of -0.06 dbar
coef0=+1.18+0.06
coef1=+0.019842
coef2=-7.18e-9
units=[dBar]
display=true

[channel]
id=11
name=P_dP
type=poly
diff_gain=20.0
display=false

[channel]
id=12
type=ucond
name=C1_dC1
a=-0.7869
b=196.9
diff_gain=0.995
adc_fs=5.000
adc_bits=16
units=[mS / cm]
display=false
; Sensor dependent cell-constant in units of metres.
K=1.03e-3
SN=

[channel]
id=13
type=ucond
name=C2_dC2
a=-0.679
b=178
diff_gain=1.00
adc_fs=5.000
adc_bits=16
units=[mS / cm]
display=false
; Sensor dependent cell-constant in units of metres
K=1.03e-3
SN=

[channel]
id=16,17
name=SBT
type=sbt
coef0=4.37388294e-3	;g
coef1=6.31289091e-4	;h
coef2=1.92059897e-5	;i
coef3=1.22978389e-6	;j
coef4=1000.0
coef5=24e6
coef6=128
display=true

; SBE3 SN-5901
; We give the g-h-i-j-f0 calibration coefficients (ITS-90). Calibrated 2022-02-22 
; These values are followed by the reference frequency of the SCOUNT (usually 24e6) and the number of periods for the averaging.

[channel]
id=18,19
name=SBC
type=sbc
coef0=-1.03901436e1	;g
coef1=0				;0
coef2=1.48794833e0	;h
coef3=9.03260496e-4	;i
coef4=2.41119146e-5	;j
coef5=24e6
coef6=128
display=true

; SBE4 SN-0560.
; We give the g-zero-h-i-j calibration coefficients. Calibrated 2022-03-02 
; These values are followed by the reference frequency of the SCOUNT (usually 24e6) and the number of periods for the averaging.

[channel]
id   = 80
name = Gnd_2
type = gnd
display=false

[channel]
id        = 81
name      = NTU
type      = voltage
adc_fs    = 5.120
adc_bits  = 16
;adc_zero = -0.057 + 2.560
adc_zero  = 2.560
;G = 0.05
G = 1
display=true

[channel]
id       = 82
name     = FL
type     = voltage
adc_bits = 16
adc_fs   = 5.120
adc_zero = 2.560
G = 1
display=true 

;Wetlabs FLNTURT SN-5067
;Output voltages and conversion to physical units have to be carried out during analysis


