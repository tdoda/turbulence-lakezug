; This is the setup file for VMP-500 (Wuest EAWAG, Switzerland).
; 2014-08-06, RGL at Rockland Scientific
;
; Use This setup file for NORMAL ASTP Board
;
; Any line that begins with ";", semi-column symbol, is a comment and is ignored 
; by all programs that read this file. Use it to make notes and comments.
;
; sensors shear and temperature have nominal values input in this setup file.
; Update these values and sensor SN-numbers prior to deployment.
; Edited 2018-05-15 adding FLNTU sensor and GPAIO PCB to instrument.
; 2018-07-18, RGL, small correction to channel 81. Added [instrumetn_info] section.

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
; This is a partial list of standard channels (addresses) and their signals
; 0	Reference ground
; 1	Ax or tilt - horizontal acceleration in the direction of the pressure port
; 2	Ay or roll - horizontal acceleration orthogonal to the direction of the pressure port
; 3	Az vertical acceleration
; 4	T1 - Temperature from Thermistor 1 without pre-emphasis
; 5	T1_dT1 - Temperature from Thermistor 1 with pre-emphasis
; 6	T2 - Temperature from Thermistor 2 without pre-emphasis
; 7	T2_dT2 - Temperature from Thermistor 2 with pre-emphasis
; 8	Sh1 - velocity derivative from shear probe 1
; 9 Sh2 - velocity derivative from shear probe 2
;10	P - pressure signal without pre-emphasis
;11	P_dP - pressure signal with pre-emphasis
;12	C1_dC1 - micro-conductivity with pre-emphasis
;13	C2_dC2 - micro-conductivity with pre-emphasis
;16,17	SBT1 - The addresses of the SBE3 thermometer that returns the least and
;       most significant halves of the 32-bit data word
;18,19	SBC1 - The addresses of the SBE4 conductivity sensor that returns the 
;       least and most significant halves of the 32-bit data word
; 80     Gnd_2,  - slow - pseudo ground
; 81     NTU     - slow - Wetlabs NTU
; 82     FL      - slow - Wetlabs FL
;255	Special Character that always returns 32752D or 7FF0H and is used to test the
;		integrity of communication.
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
;
; start of root section
rate=512
prefix=VMP
disk=
recsize=1
profile=vertical
man_com_rate=4

no-fast=9
no-slow=2
;
; end of root section
;
; start of address matrix section
[matrix]
num_rows=8
row01=	255	0	1	2	3	5	7	8	9	12	13
row02=	4	6	1	2	3	5	7	8	9	12	13
row03=	10	11	1	2	3	5	7	8	9	12	13
row04=	16	17	1	2	3	5	7	8	9	12	13
row05=	18	19	1	2	3	5	7	8	9	12	13
row06=	80	0	1	2	3	5	7	8	9	12	13
row07=	81	82	1	2	3	5	7	8	9	12	13
row08=	0	0	1	2	3	5	7	8	9	12	13
;end of address matrix section

;start if instrument information section. Must have vehicle.
[instrument_nfo]
vehicle = vmp;
model = VMP-500
SN = 28

; end of instrument information

;start of the optional cruise identification section
[cruise_id]
lake=
operator=
funding_agent=
my_favourite_pet=
my_girlfriend=
number_of_moose_shot=
;
; end of cruise identification section
;
; start of channel identification and calibration information

[channel]
id=0
name=Gnd
type=gnd

[channel]
id=1
name=Ax
type=accel
coef0=1571.5
coef1=5865.5
display=true

[channel]
id=2
name=Ay
type=accel
coef0=1606.5
coef1=5312.5
display=true

[channel]
id=3
name=Az
type=accel
coef0=-40
coef1=5154.0
display=false

[channel]
id=4
name=T1
type=therm
a=-38.0
b=0.99829
G=11
E_B=0.6822
adc_fs=5.000
adc_bits=16
units=[degC]
display=true
; Probe calibration values
beta_1=2856.202277
T_0=287.218690
SN=

[channel]
id=5
name=T1_dT1
type=therm
diff_gain=1.00
display=false

[channel]
id=6
name=T2
type=therm
a=-46
b=0.99838
G=11
E_B=0.6822
adc_fs=5.000
adc_bits=16
units=[degC]
display=true
; Probe calibration values
beta_1=2864.851896
T_0=291.605129
SN=

[channel]
id=7
name=T2_dT2
type=therm
diff_gain=1.00
display=false

[channel]
id=8
name=sh1
type=shear
adc_fs=5.000
adc_bits=16
diff_gain=1.00
display=false
; Sensitivity for Probe 
sens=0.0876
SN=M2079

[channel]
id=9
name=sh2
type=shear
adc_fs=5.000
adc_bits=16
diff_gain=1.05
display=false
; Sensitivity for Probe 
sens=0.0833
SN=M2080

[channel]
id=10
name=P
type=poly
coef0=+1.18
coef1=+0.019842
coef2=-7.18e-9
units=[dBar]
display=true

[channel]
id=11
name=P_dP
type=poly
diff_gain=20.0
display=false

[channel]
id=12
type=ucond
name=C1_dC1
a=-0.7869
b=196.9
diff_gain=0.995
adc_fs=5.000
adc_bits=16
units=[mS / cm]
display=false
; Sensor dependent cell-constant in units of metres.
K=1.03e-3
SN=

[channel]
id=13
type=ucond
name=C2_dC2
a=-0.679
b=178
diff_gain=1.00
adc_fs=5.000
adc_bits=16
units=[mS / cm]
display=false
; Sensor dependent cell-constant in units of metres
K=1.03e-3
SN=

[channel]
id=16,17
name=SBT
type=sbt
coef0=4.37415016e-3
coef1=6.31765796e-4
coef2=1.95152945e-5
coef3=1.29445264e-6
coef4=1000.0
coef5=24e6
coef6=128
display=true

; SBE3
; 4.82189564e-3,6.95511128e-4,3.26938096e-5,2.94413997e-6,1000.0,24e6,128
; For the SBE3 SN-0847. We give the g-h-i-j-f0 calibration coefficients (ITS-90). calibrated 2010-08-12 
; These values are followed by the reference frequency of the SCOUNT (usually 24e6) and
; the number of periods for the averaging.

[channel]
id=18,19
name=SBC
type=sbc
coef0=-1.03980106e1
coef1=0
coef2=1.49049376e0
coef3=2.65003650e-4
coef4=6.84716237e-5
coef5=24e6
coef6=128
display=true

; -1.03960746e1,0,1.49073761e0,3.73415683e-5,7.36447067e-5,24e6,128
; For the SBE4 SN-0560. We give the g-zero-h-i-j calibration coefficients. Calibrated 2010-08-20 
; These values are followed by the reference frequency of the SCOUNT (usually 24e6) and
; the number of periods for the averaging.

[channel]
id   = 80
name = Gnd_2
type = gnd
display=false

[channel]
id        = 81
name      = NTU
type      = voltage
adc_fs    = 5.120
adc_bits  = 16
;adc_zero = -0.057 + 2.560
adc_zero  = 2.560
;G = 0.05
G = 1
display=true

[channel]
id       = 82
name     = FL
type     = voltage
adc_bits = 16
adc_fs   = 5.120
adc_zero = 2.560
G = 1
display=true 




